

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍀 ツイてるカウンター 🍀</title>

<style>
body {
    text-align: center;
    font-family: sans-serif;
    padding-top: 40px;
    background: #f5fff5;
    touch-action: manipulation;

}

h1 {
    font-size: 40px;
    margin-bottom: 20px;
}

#count {
    font-size: 100px;
    margin: 20px;
}

#total {
    font-size: 28px;
    margin: 20px;
}

button {
    font-size: 28px;
    padding: 18px 24px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    margin: 8px 5px;
    min-width: 160px;
    line-height: 1.2;
    touch-action: manipulation;

}

button:nth-of-type(1) {
    background-color: #d9f2d9;
}

button:nth-of-type(2) {
    background-color: #ffe5cc;
}

button:nth-of-type(3) {
    background-color: #dceeff;
}

button:nth-of-type(4) {
    background-color: #eadcff;
}


#status {
    font-size: 20px;
    margin: 25px 10px;
}
@media (orientation: landscape) {
    body {
        padding-top: 10px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 5px;
    }

    #count {
        font-size: 70px;
        margin: 5px;
    }

    #total {
        font-size: 20px;
        margin: 5px;
    }

    button {
        font-size: 20px;
        padding: 10px 14px;
        margin: 4px 3px;
        min-width: 130px;
    }

    #status {
        font-size: 16px;
        margin: 8px 5px;
    }
}
  @media (orientation: landscape) {
    body {
        padding-top: 2px;
    }

    h1 {
        font-size: 22px;
        margin: 2px 0;
    }

    #count {
        font-size: 55px;
        margin: 2px;
    }

    #total {
        font-size: 16px;
        margin: 2px;
    }

    button {
        font-size: 17px;
        padding: 7px 10px;
        margin: 2px 2px;
        min-width: 110px;
    }

    #status {
        font-size: 13px;
        margin: 3px 2px;
    }
}

  
</style>
</head>

<body>

<h1>🍀 ツイてるカウンター 🍀</h1>

<div id="count">0</div>

<div id="total">⭐️ 累計：0回</div>

<button onclick="startVoice()">▶️ スタート</button>

<button onclick="stopVoice()">⏹ 停止</button>
<div style="font-size:22px; margin:10px 0;">
    <button onclick="manualCount()">
        👆 手動カウント
    </button>
    <span id="manualSelected" style="color:red; font-size:16px;"></span>
</div>

<button onclick="resetCount()">🔄 リセット</button>
<button onclick="openSettings()">⚙️ 設定</button>
<div id="settings" style="display:none; margin-top:20px;">

    <h2>⚙️ 設定</h2>

    <button onclick="showDailyRecords()">
        📅 日別記録
    </button>
<div id="dailyRecords" style="display:none;"></div>

    <br>

    <button onclick="closeSettings()">
        閉じる
    </button>

</div>
<div id="status">
「スタート」を押して「ツイてる！」と言ってください
</div>

<script>

let count = 0;
let recognition = null;
let listening = false;
let stopping = false;
let currentDate = new Date().toLocaleDateString("ja-JP");
setInterval(function() {
    const today = new Date().toLocaleDateString("ja-JP");

    if (today !== currentDate) {

        // 📅 昨日の記録を保存
        let dailyRecords = JSON.parse(
            localStorage.getItem("tuiteruDailyRecords") || "{}"
        );

        dailyRecords[currentDate] = count;

        localStorage.setItem(
            "tuiteruDailyRecords",
            JSON.stringify(dailyRecords)
        );

        // 🌅 今日のカウントを0にする
        count = 0;

        document.getElementById("count").textContent = 0;

        // 新しい日へ
        currentDate = today;

        document.getElementById("status").textContent =
            "🌅 新しい一日が始まりました！";
    }
}, 1000);

/* =========================
   カウント処理
========================= */

function manualCount() {
    if (listening) {
        stopVoice();
    }

    countUp();
   
}


function showDailyRecords() {
    const dailyRecords = JSON.parse(
        localStorage.getItem("tuiteruDailyRecords") || "{}"
    );

    const box = document.getElementById("dailyRecords");

    let message = "🍀 ツイてる記録 🍀<br><br>";

    const dates = Object.keys(dailyRecords).reverse();

    if (dates.length === 0) {
        message += "まだ記録がありません。";
    } else {

        // 🌱 今日
        const today = new Date().toLocaleDateString("ja-JP");

        if (dailyRecords[today] !== undefined) {

            const todayCount = dailyRecords[today];

            let comment = "";

            if (todayCount < 100) {
                comment = "🌱 まずは一歩！";
            } else if (todayCount < 1000) {
                comment = "🍀 いい感じ！今日もツイてる！";
            } else {
                comment = "🎉 1,000回突破！すごーい！";
            }

            message +=
                "<div style='font-size:20px;'>🌱 今日</div>" +
                "<div style='font-size:40px; font-weight:bold; margin:8px;'>" +
                todayCount + "回" +
                "</div>" +
                "<div style='font-size:18px; margin-bottom:25px;'>" +
                comment +
                "</div>";

            message +=
                "<hr style='margin:20px 0;'>";
        }

        // 📅 過去の記録
        message +=
            "<div style='font-size:20px; margin-bottom:10px;'>📅 過去の記録</div>";

        dates.forEach(function(date) {

            if (date !== today) {

                const parts = date.split("/");

                const displayDate =
                    parts[1] + "月" + parts[2] + "日";

                message +=
                    "<div style='font-size:18px; margin:6px;'>" +
                    displayDate +
                    "　" +
                    dailyRecords[date] +
                    "回" +
                    "</div>";
            }
        });
    }

    box.innerHTML = message;
    box.style.display = "block";
}

function countUp() {
    count++;

    document.getElementById("count").textContent = count;

    // ⭐️ 累計
    let total = Number(
        localStorage.getItem("tuiteruTotal") || 0
    );

    total++;

    localStorage.setItem(
        "tuiteruTotal",
        total
    );

    document.getElementById("total").textContent =
        "⭐️ 累計：" + total + "回";

    // 📅 今日の日別記録
    const today = new Date()
        .toLocaleDateString("ja-JP");

    let dailyRecords = JSON.parse(
        localStorage.getItem("tuiteruDailyRecords") || "{}"
    );

    dailyRecords[today] = count;

    localStorage.setItem(
        "tuiteruDailyRecords",
        JSON.stringify(dailyRecords)
    );
}



/* =========================
   リセット
========================= */

function resetCount() {

    count = 0;

    document.getElementById("count").textContent =
        count;

    document.getElementById("status").textContent =
        "🔄 リセットしました";
}


/* =========================
   ツイてる！と言う
========================= */

function sayTuiteru() {

    const speech =
        new SpeechSynthesisUtterance("ツイてる！");

    speech.lang = "ja-JP";
    speech.rate = 1.0;
    speech.pitch = 1.1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);
}


/* =========================
   「ツイてる」の回数を数える
========================= */

function countTuiteru(text) {

    text = text
        .replace(/[！!。、，,？?]/g, "")
        .replace(/\s/g, "");

    const pattern =
        /ついている|ついてます|ついてるよ|ツイてるよ|ツイッテル|ツイてます|ツイてる|ついてる|ツイテル|シンテル/g;

    const matches =
        text.match(pattern);

    return matches ? matches.length : 0;
}


/* =========================
   ページを開いた時
   ⭐️ 累計：を復元
========================= */

window.addEventListener("load", function() {

    const total =
        Number(
            localStorage.getItem("tuiteruTotal") || 0
        );

    document.getElementById("total").textContent =
        "⭐️ 累計：" + total + "回";
});


/* =========================
   音声認識をもう一度開始
========================= */

function listenAgain() {

    if (!listening || stopping) {
        return;
    }

    try {

        recognition.start();

        document.getElementById("status").textContent =
            "🎤 聞いています……「ツイてる！」";

    } catch (e) {

        setTimeout(
            listenAgain,
            300
        );
    }
}


/* =========================
   音声認識スタート
========================= */

function startVoice() {
 const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("status").textContent =
            "このブラウザは音声認識に対応していません。";

        return;
    }

    if (listening) {
        return;
    }

    stopping = false;
    listening = true;

    recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 5;


    /* =====================
       音声認識結果
    ===================== */

    recognition.onresult =
        function(event) {

            let hitCount = 0;

            let heardText =
                event.results[0][0].transcript;


            for (
                let i = 0;
                i < event.results[0].length;
                i++
            ) {

                const text =
                    event.results[0][i].transcript;

                const n =
                    countTuiteru(text);

                if (n > hitCount) {

                    hitCount = n;
                }
            }


            /* =================
               ツイてるを認識
            ================= */

            if (hitCount > 0) {

                for (
                    let i = 0;
                    i < hitCount;
                    i++
                ) {

                    countUp();
                }

                document.getElementById("status").textContent =
                    "🍀 ツイてる！ × " + hitCount;

                sayTuiteru();

            } else {

                document.getElementById("status").textContent =
                    "👂「" + heardText + "」と聞こえました";
            }
        };


    /* =====================
       エラー
    ===================== */

    recognition.onerror =
        function() {

            if (!stopping) {

                setTimeout(
                    listenAgain,
                    300
                );
            }
        };


    /* =====================
       音声認識終了
    ===================== */

    recognition.onend =
        function() {

            if (!stopping) {

                setTimeout(
                    listenAgain,
                    300
                );
            }
        };


    /* =====================
       開始
    ===================== */

    listenAgain();
}


/* =========================
   停止
========================= */

function stopVoice() {

    stopping = true;

    listening = false;

    if (recognition) {

        try {

            recognition.stop();

        } catch (e) {

        }
    }

    document.getElementById("status").textContent =
        "⏹ 停止しました";
}

function openSettings() {
    document.getElementById("settings").style.display = "block";
}

function closeSettings() {
    document.getElementById("settings").style.display = "none";
}
  

</script>

</body>
</html>
