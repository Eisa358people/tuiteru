<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🍀 ツイてるカウンター 🍀</title>

<style>
body {
    text-align: center;
    font-family: sans-serif;
    padding-top: 60px;
    background: #f5fff5;
}

h1 {
    font-size: 40px;
}

#count {
    font-size: 100px;
    margin: 30px;
}

button {
    font-size: 25px;
    padding: 15px 30px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    margin: 10px;
}

#status {
    font-size: 20px;
    margin: 20px;
}
</style>
</head>

<body>

<h1>🍀 ツイてるカウンター 🍀</h1>

<div id="count">0</div>

<button onclick="startVoice()">🎤 スタート</button>

<button onclick="stopVoice()">⏹ 停止</button>

<button onclick="countUp()">手動カウント</button>

<button onclick="resetCount()">🔄 リセット</button>

<div id="status">
「スタート」を押して「ツイてる！」と言ってください
</div>

<script>

let count = 0;
let recognition = null;
let listening = false;
let stopping = false;

function countUp() {
    count++;
    document.getElementById("count").textContent = count;
}

function resetCount() {
    count = 0;
    document.getElementById("count").textContent = count;
    document.getElementById("status").textContent =
        "🔄 リセットしました";
}

function sayTuiteru() {

    const speech = new SpeechSynthesisUtterance("ツイてる！");
    speech.lang = "ja-JP";
    speech.rate = 1.0;
    speech.pitch = 1.1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function isTuiteru(text) {

    text = text
        .replace(/[！!。、，,？?]/g, "")
        .replace(/\s/g, "");

    const patterns = [
        "ツイてる",
        "ついてる",
        "ツイテル",
        "ついている",
        "ツイッテル",
        "ついてます",
        "ツイてます",
        "ついてるよ",
        "ツイてるよ",
        "シンテル"
    ];

    for (const word of patterns) {
        if (text.includes(word)) {
            return true;
        }
    }

    return false;
}

function listenAgain() {

    if (!listening || stopping) {
        return;
    }

    try {
        recognition.start();

        document.getElementById("status").textContent =
            "🎤 聞いています……「ツイてる！」";

    } catch (e) {
        setTimeout(listenAgain, 300);
    }
}

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("status").textContent =
            "このブラウザは音声認識に対応していません。";

        return;
    }

    if (listening) {
        return;
    }

    stopping = false;
    listening = true;

    recognition = new SpeechRecognition();

    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;

    recognition.onresult = function(event) {

        let recognized = false;
        let heardText = event.results[0][0].transcript;

        for (let i = 0; i < event.results[0].length; i++) {

            const text = event.results[0][i].transcript;

            if (isTuiteru(text)) {
                recognized = true;
                break;
            }
        }

        if (recognized) {

            countUp();

            document.getElementById("status").textContent =
                "🍀 ツイてる！";

            sayTuiteru();

        } else {

            document.getElementById("status").textContent =
                "👂「" + heardText + "」と聞こえました";

        }
    };

    recognition.onerror = function() {

        if (!stopping) {
            setTimeout(listenAgain, 300);
        }
    };

    recognition.onend = function() {

        if (!stopping) {
            setTimeout(listenAgain, 300);
        }
    };

    listenAgain();
}

function stopVoice() {

    stopping = true;
    listening = false;

    if (recognition) {
        try {
            recognition.stop();
        } catch (e) {
        }
    }

    document.getElementById("status").textContent =
        "⏹ 停止しました";
}

</script>

</body>
</html>
