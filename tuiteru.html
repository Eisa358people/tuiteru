<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ツイてるカウンター</title>

<style>
    body {
        text-align: center;
        font-family: sans-serif;
        padding-top: 80px;
        background: #f5fff5;
    }

    h1 {
        font-size: 40px;
    }

    #count {
        font-size: 100px;
        margin: 40px;
    }

    button {
        font-size: 25px;
        padding: 15px 30px;
        border-radius: 15px;
        border: none;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>🍀 ツイてるカウンター 🍀</h1>

<div id="count">0</div>

<button onclick="countUp()">ツイてる！</button>

<script>
let count = 0;

function countUp() {
    count++;
    document.getElementById("count").textContent = count;
}
</script>

</body>
</html>
